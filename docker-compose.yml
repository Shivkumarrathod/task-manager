version: "3.8"

services:
  app:
    build: .
    container_name: taskflow_mvc_app
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: taskflow
      DB_USER: taskuser
      DB_PASS: taskpass
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: taskflow_mvc_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10
  
volumes:
  db_data:
